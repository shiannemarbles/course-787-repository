<ul ng-if="list.hasSearched && list.foundItems.length > 0">
  <li ng-repeat="item in list.foundItems">
    <!-- Display item information here -->
     <div class="item-info">
        <p>
          <b class="name" >{{item.name}} : </b><b>Short Name:</b> {{item.short_name}}, 
          <b>Description:</b> {{item.description}} 
          <button class="btn btn-danger btn-sm" ng-click="list.onRemove({index: $index});"> Don't want this one! </button>
        </p>
     </div>
     
     <!-- <button class="btn btn-danger btn-sm"
        ng-click="list.onRemove({index: $index});">
        Don't want this one!
    </button> -->
  </li>
</ul>
<p class="error" 
    ng-if="list.hasSearched && list.foundItems.length === 0">
    Nothing found
</p>
