<ol ng-if="list.hasSearched && list.foundItems.length > 0">
  <li ng-repeat="item in list.foundItems">
    <!-- Display item information here -->
     {{item.name}} | {{item.short_name}} | {{item.description}}
     <button 
        ng-click="list.onRemove({index: $index});">Don't want this one!
    </button>
  </li>
</ol>
<p class="error" ng-if="list.hasSearched && list.foundItems.length === 0">
    Nothing found
</p>
