<!doctype html>
<html lang="en">
  <head>
    <title>Shopping List Check Off</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="angular.min.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="styles/bootstrap.min.css">
    <style>
      .emptyMessage {
        font-weight: bold;
        color: red;
        font-size: 1.2em;
      }
      li {
        margin-bottom: 7px;
        font-size: 1.2em;
      }
      li > button {
        margin-left: 6px;
        font-weight: bold;
      }
      button > span {
        color: green;
      }
      .quanity-num {
        width: 60px;
      }
    </style>
  </head>
<body ng-app="ShoppingListCheckOff">
  <div class="container">
    <h1>Shopping List Check Off</h1>

    <div ng-controller="ToBuyController as toBuy" >
      <div class="row">
        <!-- To Buy List -->
        <div class="col-md-6">
          <h2>To Buy:</h2>
          <ul>
            <li ng-repeat="item in toBuy.ToBuyList">Buy <input type="number" ng-model="item.quantity" placeholder={{item.quantity}} class="quanity-num"> {{item.name}}(s)
              <button ng-click="toBuy.buyItem($index);" class="btn btn-default"><span class="glyphicon glyphicon-ok"></span> Bought</button>
            </li>
          </ul>
          <div ng-if="toBuy.isToBuyEmpty()" class="emptyMessage">Everything is bought!</div>
        </div>
      </div>

    </div> <!--toBuyController end -->

    <!-- Already Bought List -->
    <div class="col-md-6">
      <h2>Already Bought:</h2>
        <div ng-controller="AlreadyBoughtController as alreadyBought" >
          <ul>
            <li ng-repeat="item in alreadyBought.BoughtList">Bought {{item.quantity}} {{item.name}}(s) for the total price of {{item.totalPrice}} </li>
          </ul>
        <div ng-if="alreadyBought.isBoughtEmpty()" class="emptyMessage">Nothing bought yet.</div>
      </div> <!-- AlreadyBoughtController END -->
    </div>
  </div> <!-- ng-app ShoppingList Checkoff END -->

<script></script>
</body>
</html>
